  <style>
    :root {
      --bg: #ffebf3;
      --card: #fff3ff;
      --accent: #ff6b9d;
      --accent-2: #7c4dff;
      --box-bg: #d4f0ff;
      --tile-bg: #ffe066;
      --correct: #8eff8e;
      --incorrect: #ffb3b3;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Comic Sans MS', 'Fredoka One', 'Nunito', cursive, sans-serif;
      background: linear-gradient(135deg, #ffebf3 0%, #d4f0ff 100%);
      color: #333;
      touch-action: manipulation;
      overflow-x: hidden;
    }

    .app {
      width: 100%;
      max-width: 100vw;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      color: #ff4081;
      text-shadow: 1px 1px 0 #fff;
    }

    .subtitle {
      font-size: 14px;
      color: #555;
      font-weight: 600;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1), inset 0 0 0 2px #ffe6f7;
    }

    .stage {
      display: grid;
      grid-template-columns: 1fr;
    }

    @media (min-width: 768px) {
      .stage {
        grid-template-columns: 1fr 1fr;
      }
    }

    .picture {
      text-align: center;
      margin-bottom: 16px;
    }

    .picture img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      object-fit: contain;
    }

    .word-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: white;
      padding: 12px 16px;
      border-radius: 16px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(255,107,157,0.4);
      transition: all 0.2s;
      min-width: 90px;
      flex: 1 1 auto;
    }

    button.secondary {
      background: transparent;
      color: var(--accent-2);
      border: 2px solid #c8e4ff;
    }

    .boxes {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .box {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      background: var(--box-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      border: 3px dashed #a0d8f1;
      color: #2c5282;
      transition: all 0.3s ease;
    }

    @media (max-width: 480px) {
      .box {
        width: 56px;
        height: 56px;
        font-size: 20px;
      }
    }

    .box.filled {
      background: var(--correct);
      border: 3px solid #48bb78;
      color: #1a202c;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }

    .tile {
      min-width: 64px;
      padding: 14px 8px;
      border-radius: 14px;
      background: var(--tile-bg);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      text-align: center;
      font-weight: 800;
      font-size: 22px;
      color: #333;
      cursor: grab;
      transition: all 0.2s;
    }

    .feedback {
      min-height: 30px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #ff4081;
      margin-top: 12px;
    }

    .confetti {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100vh;
      pointer-events: none;
      z-index: 1000;
      overflow: hidden;
    }

    .confetti span {
      position: absolute;
      top: -30px;
      animation: fall 1500ms linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #777;
      font-weight: 600;
    }

    .back-button {
      display: block;
      width: fit-content;
      margin: 12px auto;
      padding: 10px 18px;
      background: #555;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .celebrate {
      animation: pop 0.5s ease-out;
    }

    .hint {
  text-align: center;
  font-size: 15px;
  font-weight: 700;
  color: #7c4dff;
  margin-top: 14px;
  background: #f3e8ff;
  border: 2px dashed #c8a2ff;
  border-radius: 12px;
  padding: 10px;
  max-width: 90%;
  margin-left: auto;
  margin-right: auto;
  animation: pulse 1.8s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(1); opacity: 0.8; }
}

<body>
  <button class="back-button" onclick="window.location.href='phonics.html'">Back</button>

  <div class="app">
    <header>
      <div class="card" style="padding:10px 14px; border-radius:14px; font-size:28px;">🎈</div>
      <div>
        <h1>Phonics — Build Words!</h1>
        <div class="subtitle">Tap or drag letters to complete the word!</div>
      </div>
      <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7495143337429327"
     crossorigin="anonymous"></script>
    </header>

    <div class="stage">
      <div class="card left">
        <div class="picture" id="pic"></div>
        <div class="word-controls">
          <button id="playWord">🔊 Word</button>
          <button id="playParts">🔈 Letters</button>
        </div>

        <div class="boxes" id="boxes" aria-live="polite"></div>
        <div class="feedback" id="feedback"></div>
      </div>

      <div class="card right">
        <div style="font-weight:800; margin-bottom:10px; font-size:20px; color:#ff6b9d;">🔤 Letter Tiles</div>
        <div class="tiles" id="tiles"></div>
        
        <div class="hint">Drag or tap a tile, then tap a box!</div>
      </div>
    </div>

    <div class="confetti" id="confetti"></div>
    <footer class="card">🌈 Happy Learning, Superstar! 🌈</footer>
  </div>

  <script>
    const CDN = 'https://cdn.jsdelivr.net/gh/Pravin2311/Teachings.ai@main/';

    const words = [
      { word: "ball", img: CDN + "assets/images/phonics/ball.png", parts: ["b", "a", "l", "l"], sounds: [CDN + "assets/audio/phonics/B.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/L.mp3", CDN + "assets/audio/phonics/L.mp3"] },
      { word: "egg", img: CDN + "assets/images/phonics/egg.png", parts: ["e", "g", "g"], sounds: [CDN + "assets/audio/phonics/E.mp3", CDN + "assets/audio/phonics/G.mp3", CDN + "assets/audio/phonics/G.mp3"] },
      { word: "fish", img: CDN + "assets/images/phonics/fish.png", parts: ["f", "i", "s", "h"], sounds: [CDN + "assets/audio/phonics/F.mp3", CDN + "assets/audio/phonics/I.mp3", CDN + "assets/audio/phonics/S.mp3", CDN + "assets/audio/phonics/H.mp3"] },
      { word: "goat", img: CDN + "assets/images/phonics/goat.png", parts: ["g", "o", "a", "t"], sounds: [CDN + "assets/audio/phonics/G.mp3", CDN + "assets/audio/phonics/O.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/T.mp3"] },
      { word: "hat", img: CDN + "assets/images/phonics/hat.png", parts: ["h", "a", "t"], sounds: [CDN + "assets/audio/phonics/H.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/T.mp3"] },
      { word: "ice", img: CDN + "assets/images/phonics/ice.png", parts: ["i", "c", "e"], sounds: [CDN + "assets/audio/phonics/I.mp3", CDN + "assets/audio/phonics/C.mp3", CDN + "assets/audio/phonics/E.mp3"] },
      { word: "jug", img: CDN + "assets/images/phonics/jug.png", parts: ["j", "u", "g"], sounds: [CDN + "assets/audio/phonics/J.mp3", CDN + "assets/audio/phonics/U.mp3", CDN + "assets/audio/phonics/G.mp3"] },
      { word: "kite", img: CDN + "assets/images/phonics/kite.png", parts: ["k", "i", "t", "e"], sounds: [CDN + "assets/audio/phonics/K.mp3", CDN + "assets/audio/phonics/I.mp3", CDN + "assets/audio/phonics/T.mp3", CDN + "assets/audio/phonics/E.mp3"] },
      { word: "mug", img: CDN + "assets/images/phonics/mug.png", parts: ["m", "u", "g"], sounds: [CDN + "assets/audio/phonics/M.mp3", CDN + "assets/audio/phonics/U.mp3", CDN + "assets/audio/phonics/G.mp3"] },
      { word: "pen", img: CDN + "assets/images/phonics/pen.png", parts: ["p", "e", "n"], sounds: [CDN + "assets/audio/phonics/P.mp3", CDN + "assets/audio/phonics/E.mp3", CDN + "assets/audio/phonics/N.mp3"] },
      { word: "queen", img: CDN + "assets/images/phonics/queen.png", parts: ["q", "u", "e", "e", "n"], sounds: [CDN + "assets/audio/phonics/Q.mp3", CDN + "assets/audio/phonics/U.mp3", CDN + "assets/audio/phonics/E.mp3", CDN + "assets/audio/phonics/E.mp3", CDN + "assets/audio/phonics/N.mp3"] },
      { word: "rat", img: CDN + "assets/images/phonics/rat.png", parts: ["r", "a", "t"], sounds: [CDN + "assets/audio/phonics/R.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/T.mp3"] },
      { word: "sun", img: CDN + "assets/images/phonics/sun.png", parts: ["s", "u", "n"], sounds: [CDN + "assets/audio/phonics/S.mp3", CDN + "assets/audio/phonics/U.mp3", CDN + "assets/audio/phonics/N.mp3"] },
      { word: "tap", img: CDN + "assets/images/phonics/tap.png", parts: ["t", "a", "p"], sounds: [CDN + "assets/audio/phonics/T.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/P.mp3"] },
      { word: "van", img: CDN + "assets/images/phonics/van.png", parts: ["v", "a", "n"], sounds: [CDN + "assets/audio/phonics/V.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/N.mp3"] },
      { word: "wolf", img: CDN + "assets/images/phonics/wolf.png", parts: ["w", "o", "l", "f"], sounds: [CDN + "assets/audio/phonics/W.mp3", CDN + "assets/audio/phonics/O.mp3", CDN + "assets/audio/phonics/L.mp3", CDN + "assets/audio/phonics/F.mp3"] },
      { word: "yak", img: CDN + "assets/images/phonics/yak.png", parts: ["y", "a", "k"], sounds: [CDN + "assets/audio/phonics/Y.mp3", CDN + "assets/audio/phonics/A.mp3", CDN + "assets/audio/phonics/K.mp3"] }
    ];

    const pic = document.getElementById('pic');
    const boxesEl = document.getElementById('boxes');
    const tilesEl = document.getElementById('tiles');
    const playWord = document.getElementById('playWord');
    const playParts = document.getElementById('playParts');
    const feedback = document.getElementById('feedback');
    const confetti = document.getElementById('confetti');

    let idx = 0;
    let selectedTile = null;
    let state = { filled: [] };

    function render() {
      const item = words[idx];
      pic.innerHTML = `<img src="${item.img}" alt="${item.word}" class="celebrate">`;
      boxesEl.innerHTML = '';
      tilesEl.innerHTML = '';
      state.filled = Array(item.parts.length).fill('');

      item.parts.forEach((p, i) => {
        const b = document.createElement('div');
        b.className = 'box';
        b.dataset.index = i;
        b.dataset.accept = p;
        b.addEventListener('click', () => {
          if (selectedTile && !b.textContent) {
            fillBox(b, selectedTile.dataset.value);
          }
        });
        boxesEl.appendChild(b);
      });

      const shuffled = shuffle(item.parts.slice());
      shuffled.forEach(t => {
        const el = document.createElement('div');
        el.className = 'tile';
        el.draggable = true;
        el.textContent = t.toUpperCase();
        el.dataset.value = t;
        el.addEventListener('pointerdown', onTilePointerDown);
        el.addEventListener('click', () => {
          selectedTile = el;
          feedback.textContent = `🔤 ${t.toUpperCase()} selected! Tap a box.`;
        });
        tilesEl.appendChild(el);
      });

      feedback.textContent = '🔤 Pick a letter to start!';
    }

    function onTilePointerDown(e) {
      const el = e.currentTarget;
      el.classList.add('dragging');
      const move = (ev) => {
        el.style.position = 'fixed';
        el.style.left = (ev.clientX - el.offsetWidth / 2) + 'px';
        el.style.top = (ev.clientY - el.offsetHeight / 2) + 'px';
      };
      const up = (ev) => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        el.classList.remove('dragging');
        el.style.position = '';
        el.style.left = '';
        el.style.top = '';

        const boxes = Array.from(document.querySelectorAll('.box'));
        let nearest = null;
        let minD = 9999;
        boxes.forEach(b => {
          if (b.textContent) return;
          const r = b.getBoundingClientRect();
          const dx = ev.clientX - (r.left + r.width / 2);
          const dy = ev.clientY - (r.top + r.height / 2);
          const d = Math.hypot(dx, dy);
          if (d < minD) {
            minD = d;
            nearest = b;
          }
        });

        if (nearest) {
          const val = el.dataset.value;
          const expected = nearest.dataset.accept;
          if (val === expected) {
            fillBox(nearest, val);
          } else {
            feedback.textContent = '❌ Oops! That doesn’t go here!';
            new Audio(CDN + 'assets/audio/math_feedback/wrong.mp3').play();
            setTimeout(() => feedback.textContent = '', 1000);
          }
        } 
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    }

    function fillBox(box, val) {
      const i = Number(box.dataset.index);
      const item = words[idx];
      state.filled[i] = val;
      box.textContent = val.toUpperCase();
      box.classList.add('filled');
      new Audio(CDN + 'assets/audio/phonics/pop.mp3').play();

      // Check if all boxes are filled
      if (state.filled.every(Boolean)) {
        const isCorrect = item.parts.every((p, i) => state.filled[i] === p);
        if (isCorrect) {
          feedback.textContent = `🎉 "${item.word}"!`;
          new Audio(CDN + "assets/audio/math_feedback/correct.mp3").play();

          // Speak the full word (fixed typo)
          const utterance = new SpeechSynthesisUtterance(item.word);
          utterance.rate = 1;
          utterance.pitch = 1.1;
          window.speechSynthesis.speak(utterance);

          // Confetti!
          burstConfetti();

          // Auto-next after 1.8 seconds
          setTimeout(() => {
            idx = (idx + 1) % words.length;
            render();
          }, 1800);
        } else {
          feedback.textContent = '❌ Try again!';
          new Audio(CDN + "assets/audio/phonics/wrong.mp3").play();
        }
      }
    }

    function burstConfetti() {
      const emojis = ['🎉', '✨', '🌟', '🎈', '⭐', '💖', '🌈', '🎁'];
      for (let i = 0; i < 30; i++) {
        const s = document.createElement('span');
        s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        s.style.left = (10 + Math.random() * 80) + '%';
        s.style.animationDuration = (1000 + Math.random() * 1000) + 'ms';
        confetti.appendChild(s);
        setTimeout(() => s.remove(), 2500);
      }
    }

    playWord.addEventListener('click', () => {
      const item = words[idx];
      const utterance = new SpeechSynthesisUtterance(item.word);
      utterance.rate = 0.8;
      utterance.pitch = 1.2;
      window.speechSynthesis.speak(utterance);
      feedback.textContent = `🗣️ "${item.word}"`;
    });

    playParts.addEventListener('click', () => {
      const item = words[idx];
      let delay = 0;
      item.sounds.forEach(src => {
        setTimeout(() => { new Audio(src).play(); }, delay);
        delay += 900;
      });
      feedback.textContent = `🔊 Listening to sounds...`;
    });

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Start the game
    render();
  </script>
</body>
