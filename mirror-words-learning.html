<style>
  :root{
    --bg1: #fff7ed;
    --bg2: #eef2ff;
    --card: #ffffff;
    --muted: #6b7280;
    --accent: #7c3aed;
    --good: #10b981;
    --bad: #ef4444;
    --shadow: 0 12px 30px rgba(11,35,71,0.08);
    --radius: 18px;
    --btn-h: 84px;
    --joy: 1.02;
  }
  /* page */
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:#07203a;background:linear-gradient(180deg,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased;}
  .app{max-width:980px;margin:20px auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
  header{display:flex;align-items:center;gap:12px}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:0.6px}
  /* progress */
  .progress{display:flex;gap:6px;align-items:center;margin-left:auto}
  .star{width:18px;height:18px;border-radius:6px;background:linear-gradient(135deg,#ffd166,#ffb86b);box-shadow:0 6px 12px rgba(255,184,107,0.12);display:inline-block}
  .star.inactive{opacity:0.28;transform:scale(.94)}
  /* card */
  .card{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;align-items:stretch;}
  .hint{font-size:14px;color:var(--muted);text-align:center}
  .target-wrap{display:flex;align-items:center;justify-content:center;gap:10px;flex-direction:column}
  .target{
    width:100%;
    max-width:420px;
    height:120px;
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:64px;font-weight:900;
    background:linear-gradient(180deg,#ffffff,#f0f6ff);
    box-shadow:0 10px 30px rgba(59,130,246,0.06);
    user-select:none;
    transform-origin:center;
  }
  .target.celebrate{ animation:pop .9s cubic-bezier(.2,.9,.3,1); }
  @keyframes pop{ 0%{ transform:scale(1) } 40%{ transform:scale(1.08) } 100%{ transform:scale(1) } }

  /* options */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .option-btn{
    height:var(--btn-h);
    border-radius:14px;
    border:0;
    font-size:28px;
    font-weight:900;
    cursor:pointer;
    background:linear-gradient(180deg,#fff,#f6fbff);
    box-shadow:0 10px 24px rgba(11,35,71,0.06);
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s cubic-bezier(.2,.9,.3,1), box-shadow .12s ease, opacity .12s;
    touch-action:manipulation;
    user-select:none;
    color:#03304a;
  }
  .option-btn:active{ transform:translateY(4px) scale(.995); }
  /* colorful variants for visual variety */
  .option-btn.c1{ background:linear-gradient(135deg,#ffd6a5,#ffadad); }
  .option-btn.c2{ background:linear-gradient(135deg,#c7f9cc,#a7f3d0); }
  .option-btn.c3{ background:linear-gradient(135deg,#d7f3ff,#bfe9ff); }
  .option-btn.c4{ background:linear-gradient(135deg,#f3d4ff,#e7b5ff); }

  .option-btn.good{ box-shadow:0 18px 36px rgba(16,185,129,0.14); transform:translateY(-4px) scale(1.02); color:#04331b; border:2px solid rgba(255,255,255,0.85); }
  .option-btn.bad{ animation:shake .36s; box-shadow:0 6px 12px rgba(239,68,68,0.06); opacity:0.98; }
  @keyframes shake{ 0%{ transform:translateX(0)} 25%{ transform:translateX(-8px)} 50%{ transform:translateX(8px)} 75%{ transform:translateX(-4px)} 100%{ transform:translateX(0)} }

  /* controls */
  .controls{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .btn{padding:12px 16px;border-radius:12px;border:0;font-weight:800;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,#60A5FA,#7C3AED);color:white;box-shadow:0 10px 28px rgba(99,102,241,0.12)}
  .btn.ghost{background:transparent;border:2px dashed rgba(10,20,40,0.06);color:var(--muted)}
  .score{font-weight:900;color:#0b2540}
  .footer-note{font-size:13px;color:var(--muted);text-align:center}

  /* confetti canvas */
  #confetti{ position:absolute; left:0; top:0; pointer-events:none; z-index:30; }

  /* small screens */
  @media (max-width:520px){
    .options{grid-template-columns:1fr;}
    .target{font-size:48px;height:96px}
    .option-btn{font-size:22px;height:72px}
    .app{padding:10px}
  }

<body>
<div class="app" id="appRoot">
  <header>
    <h1>Reflection Words ✨</h1>
    <div class="progress" aria-hidden="true" id="progressStrip"></div>
    <div style="margin-left:auto" class="score" id="score">0 / 0</div>
  </header>

  <div class="card" role="main" aria-live="polite">
    <h1>Teachings.ai</h1>
    <div class="hint">Tap the correct reflected (reversed) version of the word shown below. Have fun! 🎉</div>

    <div class="target-wrap">
      <div id="target" class="target" aria-label="Target word">NET</div>
      <div id="reaction" style="height:28px;"></div>
    </div>

    <div class="options" id="options" aria-label="Answer options">
      <!-- options injected here -->
    </div>

    <div class="controls">
      <div style="display:flex;gap:10px;align-items:center">
        <button id="skipBtn" class="btn ghost" aria-label="Skip word">Skip</button>
        <button class="btn primary" onclick="window.location.href='index.html'">◀︎ Back</button>
        <button id="retryBtn" class="btn ghost" style="display:none" aria-label="Try again">Try Again</button>
      </div>
      <div>
        <button id="nextBtn" class="btn primary" disabled aria-label="Next word">Next ▶︎</button>
      </div>
    </div>

    <div class="footer-note">Words are 3–4 letters only. Reflection means reversed letters (NET → TEN).</div>
  </div>

<canvas id="confetti"></canvas>

<!-- audio: replace src with your file -->
<audio id="happyBell" src="/assets/audio/math_feedback/correct.mp3" preload="auto"></audio>

<script>
/* Playful Reflection Words — integrated, colorful, confetti + bell
   Uses the 3-4 letter pool, big CTA buttons, confetti on success.
*/

// ====== WORD POOL (3-4 letters only) ======
const WORDS = [
  "NET","PAN","TAP","SAW","TOP","NOW","RAT","GOD",
  "STOP","LOOP","PART","STAR","FLOW"
];

let pool = [...WORDS];
let current = null;
let correctAnswer = null;
let score = 0, attempts = 0;
const targetEl = document.getElementById('target');
const optionsEl = document.getElementById('options');
const scoreEl = document.getElementById('score');
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');
const retryBtn = document.getElementById('retryBtn');
const progressStrip = document.getElementById('progressStrip');
const bell = document.getElementById('happyBell');

function reverseWord(w){ return w.split('').reverse().join(''); }
function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function makeDistractors(word, count=2){
  const out = new Set();
  const candidates = WORDS.filter(p => p !== word).map(p => reverseWord(p));
  for(let i=candidates.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  for(const c of candidates){
    if(out.size >= count) break;
    if(c !== reverseWord(word)) out.add(c);
  }
  while(out.size < count){
    const arr = reverseWord(word).split('');
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    out.add(arr.join(''));
  }
  return Array.from(out);
}

/* Progress strip (stars) */
function refreshProgressStrip(){
  const done = attempts;
  const total = Math.max(6, WORDS.length);
  progressStrip.innerHTML = '';
  for(let i=0;i<6;i++){
    const s = document.createElement('div');
    s.className = 'star' + (i < Math.min(done,6) ? '' : ' inactive');
    progressStrip.appendChild(s);
  }
}

/* render a round */
function renderRound(){
  if(pool.length === 0) pool = [...WORDS];
  const idx = Math.floor(Math.random()*pool.length);
  current = pool.splice(idx,1)[0];
  targetEl.textContent = current;
  targetEl.classList.remove('celebrate');
  correctAnswer = reverseWord(current);

  const d = makeDistractors(current, 2);
  const opts = [correctAnswer, ...d];
  for(let i=opts.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }

  optionsEl.innerHTML = '';
  opts.forEach((opt, i) => {
    const b = document.createElement('button');
    b.className = 'option-btn ' + ['c1','c2','c3','c4'][i % 4];
    b.textContent = opt;
    b.setAttribute('aria-label', `Option ${opt}`);
    b.addEventListener('click', ()=> onOptionClick(b, opt));
    optionsEl.appendChild(b);
  });

  nextBtn.disabled = true;
  retryBtn.style.display = 'none';
  refreshScore();
  refreshProgressStrip();
}

/* user selection logic */
function onOptionClick(button, opt){
  const all = Array.from(document.querySelectorAll('.option-btn'));
  all.forEach(btn => btn.disabled = true);

  if(opt === correctAnswer){
    attempts++; score++;
    button.classList.add('good');
    celebrateCorrect(button);
    nextBtn.disabled = false;
    retryBtn.style.display = 'none';
    refreshScore();
  } else {
    attempts++;
    button.classList.add('bad');
    showTryAgain();
    setTimeout(()=> {
      const btns = Array.from(document.querySelectorAll('.option-btn'));
      btns.forEach(btn => btn.disabled = false);
    }, 420);
    refreshScore();
  }
}

/* celebrate: confetti + bell + target pop */
function celebrateCorrect(button){
  try{ playBell(); }catch(e){}
  popTarget();
  launchConfetti();
  // highlight correct button a bit longer
  setTimeout(()=> {
    // keep it visible; enabling Next is enough
  }, 600);
}

/* small pop animation for target */
function popTarget(){
  targetEl.classList.add('celebrate');
}

/* try again hint */
function showTryAgain(){
  retryBtn.style.display = 'inline-block';
}

/* Next / Skip / Retry */
nextBtn.addEventListener('click', ()=> renderRound());
skipBtn.addEventListener('click', ()=> { attempts++; refreshScore(); renderRound(); });
retryBtn.addEventListener('click', ()=> {
  retryBtn.style.display = 'none';
  const bad = document.querySelector('.option-btn.bad');
  if(bad) bad.classList.remove('bad');
  const btns = Array.from(document.querySelectorAll('.option-btn'));
  btns.forEach(btn => btn.disabled = false);
});

/* score UI */
function refreshScore(){ scoreEl.textContent = `${score} / ${attempts}`; refreshProgressStrip(); }

/* audio play: try <audio> element first */
function playBell(){
  try{
    if(bell && bell.play){
      bell.currentTime = 0;
      bell.play().catch(()=>{}); // ignore blocked playback
      return;
    }
  }catch(e){}
  // fallback beep
  try{
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const now = ac.currentTime;
    const o1 = ac.createOscillator(), g = ac.createGain();
    o1.type = 'sine'; o1.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.5, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    o1.connect(g); g.connect(ac.destination);
    o1.start(now); o1.stop(now + 0.65);
  }catch(e){}
}

/* confetti implementation (lightweight) */
const confCanvas = document.getElementById('confetti');
const confCtx = confCanvas.getContext('2d');
let confettiItems = [];
function resizeConfetti(){
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function launchConfetti(){
  // create pieces
  const count = 32;
  confettiItems = [];
  for(let i=0;i<count;i++){
    confettiItems.push({
      x: window.innerWidth * 0.5 + (Math.random()-0.5) * 200,
      y: window.innerHeight * 0.35 + (Math.random()-0.5) * 80,
      vx: (Math.random()-0.5) * 6,
      vy: Math.random() * 6 + 2,
      size: Math.random() * 8 + 6,
      rot: Math.random()*Math.PI*2,
      color: randChoice(['#FFD166','#FF6B6B','#6EE7B7','#60A5FA','#C084FC','#FFD6A5'])
    });
  }
  requestAnimationFrame(stepConfetti);
  setTimeout(()=>{ confettiItems = []; confCtx.clearRect(0,0,confCanvas.width, confCanvas.height); }, 1600);
}

function stepConfetti(){
  confCtx.clearRect(0,0,confCanvas.width, confCanvas.height);
  confettiItems.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.rot += 0.15;
    confCtx.save();
    confCtx.translate(p.x, p.y);
    confCtx.rotate(p.rot);
    confCtx.fillStyle = p.color;
    confCtx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
    confCtx.restore();
  });
  if(confettiItems.length) requestAnimationFrame(stepConfetti);
}

/* utilities */
function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

/* keyboard accessibility */
window.addEventListener('keydown', (e) => {
  const btns = Array.from(document.querySelectorAll('.option-btn'));
  if(e.key === '1' && btns[0]) btns[0].click();
  if(e.key === '2' && btns[1]) btns[1].click();
  if(e.key === '3' && btns[2]) btns[2].click();
  if(e.key === 'Enter' && !nextBtn.disabled) nextBtn.click();
});

/* unlock audio on first interaction to improve mobile reliability */
window.addEventListener('pointerdown', function onceUnlock(){
  try{ if(bell && bell.play){ bell.play().then(()=>{ bell.pause(); bell.currentTime = 0; }).catch(()=>{}); } }catch(e){}
  window.removeEventListener('pointerdown', onceUnlock);
});

// init
renderRound();
refreshProgressStrip();
</script>
</body>
