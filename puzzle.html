<!DOCTYPE html>
<html>
<head>
<title>Kids Puzzle Game (Touch + Timer + Score)</title>
<style>
    body {
        font-family: Arial;
        text-align: center;
        margin: 10px;
        background: #f8fbff;
    }

    #upload {
        margin: 15px 0;
    }

    #puzzle-board, #pieces {
        display: flex;
        flex-wrap: wrap;
        width: 90vw;
        max-width: 500px;
        margin: 15px auto;
        border: 2px solid #555;
        background: #f0f0f0;
        min-height: 200px;
        border-radius: 10px;
    }

    .slot, .piece {
        width: calc(90vw / 5 - 6px);
        max-width: 96px;
        height: calc(90vw / 5 - 6px);
        max-height: 96px;
        border: 1px solid #ccc;
        background-size: cover;
        background-position: center;
        border-radius: 8px;
    }

    #pieces .piece {
        cursor: grab;
        touch-action: none;
    }

    #time, #score {
        font-size: 20px;
        margin-top: 10px;
        font-weight: bold;
    }

    #completeMessage {
        font-size: 23px;
        color: green;
        margin-top: 15px;
    }
</style>
</head>
<body>

<h2>Kids Image Puzzle Game</h2>

<input id="upload" type="file" accept="image/*">

<div id="time">Time: 0 sec</div>
<div id="score">Score: 0</div>

<h3>Puzzle Board</h3>
<div id="puzzle-board"></div>

<h3>Pieces</h3>
<div id="pieces"></div>

<div id="completeMessage"></div>

<script>
let draggedPiece = null;
let timer = null;
let seconds = 0;
let gameStarted = false;

const upload = document.getElementById("upload");
const puzzleBoard = document.getElementById("puzzle-board");
const piecesContainer = document.getElementById("pieces");
const timeDisplay = document.getElementById("time");
const scoreDisplay = document.getElementById("score");
const completeMessage = document.getElementById("completeMessage");

upload.addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.src = URL.createObjectURL(file);
    
    img.onload = () => {
        createPuzzle(img);
    };
});

function startTimer() {
    if (gameStarted) return;
    gameStarted = true;

    timer = setInterval(() => {
        seconds++;
        timeDisplay.textContent = "Time: " + seconds + " sec";
    }, 1000);
}

function stopTimer() {
    clearInterval(timer);
}

function createPuzzle(img) {
    puzzleBoard.innerHTML = "";
    piecesContainer.innerHTML = "";
    completeMessage.textContent = "";
    
    seconds = 0;
    gameStarted = false;
    timeDisplay.textContent = "Time: 0 sec";
    scoreDisplay.textContent = "Score: 0";

    const pieceCount = 10;
    const pieceWidth = img.width / 5;
    const pieceHeight = img.height / 2;

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);

    let pieces = [];

    for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 5; col++) {
            const pCanvas = document.createElement("canvas");
            pCanvas.width = pieceWidth;
            pCanvas.height = pieceHeight;

            const pctx = pCanvas.getContext("2d");
            pctx.drawImage(
                img,
                col * pieceWidth, row * pieceHeight,
                pieceWidth, pieceHeight,
                0, 0,
                pieceWidth, pieceHeight
            );

            pieces.push({
                correctIndex: row * 5 + col,
                imgSrc: pCanvas.toDataURL()
            });
        }
    }

    // RANDOMIZE
    pieces.sort(() => Math.random() - 0.5);

    // Slots
    for (let i = 0; i < 10; i++) {
        const slot = document.createElement("div");
        slot.className = "slot";
        slot.dataset.index = i;

        // Mouse & Touch support
        slot.addEventListener("dragover", e => e.preventDefault());
        slot.addEventListener("drop", dropPiece);

        slot.addEventListener("touchend", dropTouch);

        puzzleBoard.appendChild(slot);
    }

    // Draggable pieces
    pieces.forEach(piece => {
        const div = document.createElement("div");
        div.className = "piece";
        div.style.backgroundImage = `url(${piece.imgSrc})`;
        div.draggable = true;
        div.dataset.correct = piece.correctIndex;

        // Mouse drag
        div.addEventListener("dragstart", dragStart);

        // Touch drag
        div.addEventListener("touchstart", touchStart);
        div.addEventListener("touchmove", touchMove);
        div.addEventListener("touchend", touchEnd);

        piecesContainer.appendChild(div);
    });
}

// MOUSE DRAG
function dragStart(e) {
    startTimer();
    draggedPiece = e.target;
}

function dropPiece(e) {
    if (!draggedPiece) return;
    e.target.appendChild(draggedPiece);
    checkCompletion();
}

// TOUCH DRAG
let touchDragging = null;

function touchStart(e) {
    startTimer();
    touchDragging = e.target;
    draggedPiece = e.target;
}

function touchMove(e) {
    const touch = e.touches[0];
    const el = touchDragging;

    el.style.position = "absolute";
    el.style.left = touch.pageX - 50 + "px";
    el.style.top = touch.pageY - 50 + "px";
    el.style.zIndex = 9999;
}

function touchEnd(e) {
    touchDragging.style.position = "static";
}

function dropTouch(e) {
    if (!draggedPiece) return;
    if (e.target.classList.contains("slot")) {
        e.target.appendChild(draggedPiece);
    }
    checkCompletion();
}

function checkCompletion() {
    const slots = document.querySelectorAll(".slot");

    for (let s of slots) {
        if (s.children.length === 0) return;
        if (s.children[0].dataset.correct != s.dataset.index) return;
    }

    stopTimer();

    const score = Math.max(1000 - seconds * 10, 0);
    scoreDisplay.textContent = "Score: " + score;

    completeMessage.textContent = "🎉 Puzzle Completed! Great job! 🎉";
}
</script>

</body>
</html>
