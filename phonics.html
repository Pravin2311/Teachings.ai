<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Phonics app: say sounds then word. C-A-T → cat. Uses your images and sounds. One file.">
  <title>Sound & Blend | teachings.ai</title>
   
  <link rel="stylesheet" href="css/phonics.css">

</head>
<body>

  <!-- Main App -->
  <div class="container">
    <button class="btn" onclick="window.location.href='index.html'">Back</button>
    <h1>🔤 Sound & Blend</h1>
    
    <div class="word-card">
    
      <img id="wordImage" class="word-image" src="images/cat.png" alt="cat">
      <div id="wordText" class="word-text">cat</div>
    </div>

    <button class="btn" onclick="blendWord()">🔊 Sound It Out</button>
    <button class="btn" onclick="nextWord()">➡️ Next Word</button>

    <p class="progress">Word <span id="current">1</span> of 9</p>
    
    <!-- Parent Tip -->
  <div class="container tip">
    <h3>🎯 How to Help</h3>
    <p>Say each sound with your child: <strong>"/c/ ... /a/ ... /t/ ... cat!"</strong><br>
    This teaches how letters <strong>blend</strong> into words — the key to reading!</p>
    <p><em>— teachings.ai</em></p>
  </div>

  </div>

  

  <!-- Audio Elements -->
  <!-- A to Z Audio Elements -->
<audio id="sound-a" src="assets/audio/phonics/A.mp3"></audio>
<audio id="sound-b" src="assets/audio/phonics/B.mp3"></audio>
