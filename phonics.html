  <!-- Parent Tip Section -->
  <div class="container tip">
    <h3>🎯 How to Help Your Child</h3>
    <p>Say each sound together: <strong>"/c/ ... /a/ ... /t/ ... cat!"</strong><br>
    This teaches how letters <strong>blend</strong> into words — the foundation of reading!</p>
