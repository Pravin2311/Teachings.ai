<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Teachings.ai Reels</title>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XVYMNTZLQJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-XVYMNTZLQJ');
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', system-ui, -apple-system, sans-serif;
      touch-action: pan-y;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .reel {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #111;
    }

    /* 🌀 Enhanced Loading UI */
    .reel::before {
      content: '';
      position: absolute;
      width: 60px;
      height: 60px;
      border: 4px solid #333;
      border-top: 4px solid #FFD93D;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 20;
    }

    .reel span.loader-text {
      position: absolute;
      bottom: 40px;
      color: #aaa;
      font-size: 16px;
      text-align: center;
      z-index: 20;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .reel.loaded::before,
    .reel.loaded span.loader-text {
      display: none;
    }

    /* 🛡️ Overlay to block iframe interaction until sound is enabled */
    #tapBlocker {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99990;
      pointer-events: none;
      background: transparent;
    }

    body.sound-not-enabled #tapBlocker {
      pointer-events: auto;
      background: transparent;
    }

    /* 🎵 Floating Sound Button */
    #playSoundBtn {
      position: fixed;
      top: 24px;
      right: 24px;
      background: linear-gradient(135deg, #FF6B6B, #FFD93D);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
      cursor: pointer;
      z-index: 99999;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      align-items: center;
      gap: 10px;
      animation: pulse 2s infinite;
      pointer-events: auto;
      -webkit-user-select: none;
      user-select: none;
    }

    #playSoundBtn:hover,
    #playSoundBtn:active {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.8);
    }

    @keyframes pulse {
      0% { box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6); }
      50% { box-shadow: 0 6px 30px rgba(255, 217, 61, 0.9); }
      100% { box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6); }
    }

    /* Volume Confirmation Icon */
    #volumeIcon {
      position: fixed;
      top: 24px;
      right: 24px;
      font-size: 36px;
      color: #FFD93D;
      opacity: 0;
      transition: opacity 0.5s ease;
      z-index: 99998;
      text-shadow: 0 0 10px rgba(255, 217, 61, 0.8);
      pointer-events: none;
    }

    #volumeIcon.show {
      opacity: 1;
      animation: bounce 0.8s;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-10px);}
      60% {transform: translateY(-5px);}
    }

    /* ✅ FIXED: Clean, non-overlapping side buttons */
    .sideButtons {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 99999;
    }

    .sideButtons button {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }

    .sideButtons button:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.1);
    }
  </style>
</head>
<body class="sound-not-enabled">
  <div id="reels"></div>

  <!-- 🛡️ Tap Blocker Overlay -->
  <div id="tapBlocker"></div>

  <!-- 🎵 Sound Button -->
  <button id="playSoundBtn">🔊 Turn On Sound!</button>

  <!-- Side buttons -->
  <div class="sideButtons">
    <button id="homeBtn" title="Go to Home">🏠</button>
    <button id="shareBtn" title="Share this Reel">📤</button>
  </div>

  <!-- 🎶 Volume Confirmation -->
  <div id="volumeIcon">🎶 Sound On!</div>

  <script>
    const videoList = [
      "Ix8v3JDvxzk","_YW162yoB7Y","YhScbL1Trak","Hy1jl53HP1A",
      "VaNMqetK1cQ", "aZnz_4S7eOE","EmY31OgiC30","P-CrtwHtjBo",
      "M5RqCXFLyKI", "_qlaXVTMcw0","vtt5Hhab6wA","mGPqatakj0o",
      "ytum8AbIoMc",  "zyH3qXeyWgc","Aqf5z_hV8PM","C-Z0-UNvClg",
      "vl5euxCaLyY","349eK87P9AU","utqShjGy0W0","urIpVImWmXA"
    ];

    const reelsContainer = document.getElementById("reels");
    let players = [];
    let readyPlayers = [];
    let soundEnabled = false;
    let apiLoaded = false;

    // Lazy-load iframes with retry & preloading
    const reelElements = [];

    videoList.forEach((id, index) => {
      const div = document.createElement("div");
      div.className = "reel";
      div.dataset.videoId = id;
      div.dataset.index = index;
      
      // Add loading text
      const loaderText = document.createElement('span');
      loaderText.className = 'loader-text';
      loaderText.textContent = 'Loading video...';
      div.appendChild(loaderText);
      
      reelsContainer.appendChild(div);
      reelElements.push(div);
    });

    // Load Observer with retry logic
    const loadObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const div = entry.target;
          const id = div.dataset.videoId;
          const index = div.dataset.index;

          if (!div.querySelector('iframe')) {
            loadVideoIframe(div, id, index);
          }
          loadObserver.unobserve(div);
        }
      });
    }, { rootMargin: "300px" }); // Start loading earlier

    // Preload next reel when current one is playing
    const playObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const index = Number(entry.target.dataset.index);
        if (players[index]) {
          if (entry.isIntersecting) {
            players[index].playVideo();
            if (soundEnabled) players[index].unMute();
            
            // ✅ PRELOAD NEXT VIDEO
            const nextIndex = index + 1;
            if (nextIndex < reelElements.length && !reelElements[nextIndex].querySelector('iframe')) {
              const nextId = reelElements[nextIndex].dataset.videoId;
              loadVideoIframe(reelElements[nextIndex], nextId, nextIndex);
            }
          } else {
            players[index].pauseVideo();
          }
        }
      });
    }, { threshold: 0.5 });

    reelElements.forEach(el => {
      loadObserver.observe(el);
      playObserver.observe(el);
    });

    function loadVideoIframe(div, id, index) {
      const iframe = document.createElement('iframe');
      // ✅ FIXED: Removed extra spaces + added quality hint for faster start
      iframe.src = `https://www.youtube.com/embed/${id}?enablejsapi=1&mute=1&playsinline=1&origin=${encodeURIComponent(window.location.origin)}&vq=small`;
      iframe.allow = "autoplay; encrypted-media; fullscreen";
      iframe.allowFullscreen = true;
      iframe.loading = "eager"; // Prioritize loading
      div.appendChild(iframe);

      if (!apiLoaded) {
        loadYouTubeAPI();
      }

      let attempts = 0;
      const maxAttempts = 3;

      const checkAPI = setInterval(() => {
        if (window.YT && typeof YT.Player === 'function') {
          clearInterval(checkAPI);
          players[index] = new YT.Player(iframe, {
            events: {
              'onReady': (event) => {
                readyPlayers.push(event.target);
                div.classList.add('loaded');
              },
              'onStateChange': (event) => {
                if (event.data === YT.PlayerState.PLAYING) {
                  if (!soundEnabled) event.target.mute();
                  else event.target.unMute();
                }
                // ✅ AUTO-REPLAY CURRENT VIDEO WHEN IT ENDS
                else if (event.data === YT.PlayerState.ENDED) {
                  // Seek to start and play again
                  event.target.seekTo(0);
                  event.target.playVideo();
                  if (soundEnabled) event.target.unMute(); // Ensure sound stays on
                }
              },
              'onError': (event) => {
                if (attempts < maxAttempts) {
                  attempts++;
                  console.log(`Retry ${attempts} for video ${id}`);
                  div.innerHTML = ''; // Clear failed iframe
                  loadVideoIframe(div, id, index); // Retry
                } else {
                  div.querySelector('span.loader-text').textContent = 'Failed to load. Swipe for next.';
                }
              }
            }
          });
        }
      }, 200); // Check more frequently
    }

    // ✅ FIXED: Clean API URL
    function loadYouTubeAPI() {
      if (apiLoaded) return;
      apiLoaded = true;
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      tag.async = true;
      document.head.appendChild(tag);
    }

    function getCurrentReelIframe() {
      let best = null;
      let bestRatio = 0;
      document.querySelectorAll('.reel').forEach(reel => {
        const rect = reel.getBoundingClientRect();
        const visible = Math.max(0, Math.min(rect.bottom, window.innerHeight) - Math.max(rect.top, 0));
        const ratio = visible / rect.height;
        if (ratio > bestRatio) {
          bestRatio = ratio;
          best = reel.querySelector('iframe');
        }
      });
      return best;
    }

    // 🔊 Sound Button Handler
    const playSoundBtn = document.getElementById('playSoundBtn');
    const volumeIcon = document.getElementById('volumeIcon');
    const tapBlocker = document.getElementById('tapBlocker');
    const homeBtn = document.getElementById('homeBtn');
    const shareBtn = document.getElementById('shareBtn');

    playSoundBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      event.preventDefault();

      if (!soundEnabled) {
        document.body.classList.add('sound-enabling');
        soundEnabled = true;
        playSoundBtn.style.display = 'none';
        volumeIcon.classList.add('show');
        document.body.classList.remove('sound-not-enabled');

        // Play & unmute first visible video
        const visibleReel = document.querySelector('.reel');
        if (visibleReel) {
          const index = Number(visibleReel.dataset.index);
          if (players[index]) {
            players[index].playVideo();
            players[index].unMute();
          } else if (visibleReel.dataset.videoId) {
            // If not loaded yet, trigger load
            loadVideoIframe(visibleReel, visibleReel.dataset.videoId, index);
          }
        }

        setTimeout(() => {
          volumeIcon.classList.remove('show');
          document.body.classList.remove('sound-enabling');
        }, 2000);
      }
    });

    // 🏠 Home Button
    homeBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      event.preventDefault();
      window.location.href = "https://teachings.ai"; // ✅ Clean URL
    });

    // 📤 Share Button
    shareBtn.addEventListener('click', async (event) => {
      event.stopPropagation();
      event.preventDefault();

      const iframe = getCurrentReelIframe();
      const currentVideo = iframe ? iframe.src : window.location.href;

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Check this video!',
            url: currentVideo
          });
        } catch (err) {
          console.log('Share canceled or failed:', err);
        }
      } else {
        // Fallback for iOS/Safari
        const el = document.createElement('textarea');
        el.value = currentVideo;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        alert('Link copied to clipboard! 📋\nShare it with friends.');
      }
    });

    // Touch handlers for swipe
    document.addEventListener('touchmove', function(event) {
      if (event.scale !== 1) {
        event.preventDefault();
      }
    }, { passive: false });

    let lastTouchEnd = 0;
    let lastTouchY = 0;
    let isSwiping = false;

    document.addEventListener('touchstart', function(event) {
      lastTouchY = event.touches[0].clientY;
      isSwiping = false;
    }, { passive: true });

    document.addEventListener('touchmove', function(event) {
      const currentY = event.touches[0].clientY;
      if (Math.abs(currentY - lastTouchY) > 10) {
        isSwiping = true;
      }
    }, { passive: true });

    document.addEventListener('touchend', function(event) {
      const now = new Date().getTime();
      if (now - lastTouchEnd <= 300 && !isSwiping) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });
  </script>
</body>
</html>
