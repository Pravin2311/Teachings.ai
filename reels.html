<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachings.ai Reels</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .reel {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      scroll-snap-align: start;
      background: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #volumeIcon {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 30px;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 999;
    }
    #volumeIcon.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="reels"></div>
  <div id="volumeIcon">🔊</div>

  <script>
    const videoList = [
      "Ix8v3JDvxzk","_YW162yoB7Y","YhScbL1Trak","Hy1jl53HP1A",
      "VaNMqetK1cQ","EmY31OgiC30","P-CrtwHtjBo","M5RqCXFLyKI",
      "ytum8AbIoMc","_qlaXVTMcw0","vtt5Hhab6wA","mGPqatakj0o",
      "vl5euxCaLyY","zyH3qXeyWgc","Aqf5z_hV8PM","C-Z0-UNvClg",
      "349eK87P9AU","utqShjGy0W0","urIpVImWmXA"
    ];

    const reelsContainer = document.getElementById("reels");
    videoList.forEach(id => {
      const div = document.createElement("div");
      div.className = "reel";
      div.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${id}?enablejsapi=1&mute=1&playsinline=1"
          allow="autoplay; encrypted-media; fullscreen"
          allowfullscreen></iframe>`;
      reelsContainer.appendChild(div);
    });

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    let players = [];
    let readyPlayers = [];
    let soundEnabled = false;

    function onYouTubeIframeAPIReady() {
      const iframes = document.querySelectorAll("iframe");
      iframes.forEach((iframe, i) => {
        players[i] = new YT.Player(iframe, {
          events: {
            'onReady': (event) => {
              readyPlayers.push(event.target);
            }
          }
        });
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          const index = [...document.querySelectorAll(".reel")].indexOf(entry.target);
          if (players[index]) {
            if (entry.isIntersecting) {
              players[index].playVideo();
              if (soundEnabled) players[index].unMute();
            } else {
              players[index].pauseVideo();
            }
          }
        });
      }, { threshold: 0.7 });

      document.querySelectorAll(".reel").forEach(reel => observer.observe(reel));
    }

    const volumeIcon = document.getElementById('volumeIcon');

    document.addEventListener('click', () => {
      if (!soundEnabled) {
        soundEnabled = true;
        readyPlayers.forEach(p => p.unMute());
        showVolumeIcon();
      }
    });

    function showVolumeIcon() {
      volumeIcon.classList.add('show');
      setTimeout(() => {
        volumeIcon.classList.remove('show');
      }, 2000);
    }
  </script>
</body>
</html>
